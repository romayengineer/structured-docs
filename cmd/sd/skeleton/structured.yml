schema_dir: schema
data_dir: data
template_dir: templates
output_dir: ../docs
readme_path: ../README.md
template_order:
  - post.template.md
validate:
  lines_between_headers:
    h2: 1
    h3: 1
    h4: 1
    default: 1
  file_name:
    style: kebab
    allow_leading_digit: false
generate_readme: true
